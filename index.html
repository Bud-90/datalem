<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datalem — Bientôt en ligne</title>
<meta name="description" content="Le site de Datalem, gestion de site internet et conseil informatique, arrive bientôt.">
<meta name="robots" content="noindex">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c2033; --ink-soft:#54626c; --cream:#f2f6f4;
    --accent-bright:#69be28; --gradient:linear-gradient(120deg,#002244 0%,#0d3a63 55%,#154d2e 100%);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:'Inter', sans-serif;background:var(--gradient);color:#fff;
    text-align:center;padding:24px;
  }
  .card{max-width:420px;}
  .brand img{height:96px;width:auto;display:block;margin:0 auto 28px;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.7rem;margin:0 0 12px;color:#fff;}
  p{color:#cfe0d4;font-size:1rem;line-height:1.6;margin:0 0 8px;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="logo.svg" alt="Datalem">
    </div>
    <h1>Bientôt en ligne</h1>
    <p>Le site de Datalem — gestion de site internet &amp; conseil informatique — est en cours de préparation.</p>
  </div>
</body>
</html>
